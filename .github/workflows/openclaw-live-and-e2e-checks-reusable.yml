    outputs:
      image: ${{ steps.image.outputs.image }}
      bare_image: ${{ steps.image.outputs.bare_image }}
      functional_image: ${{ steps.image.outputs.functional_image }}
    env:
      OPENCLAW_DOCKER_E2E_SELECTED_SHA: ${{ needs.validate_selected_ref.outputs.selected_sha }}
      OPENCLAW_SKIP_DOCKER_BUILD: "0"
      INCLUDE_OPENWEBUI: ${{ inputs.include_openwebui }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate_selected_ref.outputs.selected_sha }}
          fetch-depth: 1

      - name: Checkout trusted release harness
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: .release-harness

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "true"

      - name: Determine Docker E2E images
        id: image
        shell: bash
        run: |
          set -euo pipefail
          bash .release-harness/scripts/docker-e2e-image-outputs.sh

      - name: Log in to GHCR
        run: bash .release-harness/scripts/ci-docker-login-ghcr.sh
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build or pull Docker E2E images
        shell: bash
        run: |
          set -euo pipefail
          bash .release-harness/scripts/test-docker-build-e2e-images.sh
